</script><link rel="stylesheet" href="/_astro/Base.CotToWBB.css"></head><body><div class="wrap"><header class="site-head"><a class="logo" href="/">Jasper</a><nav class="site-nav" aria-label="主選單"><a href="/works/" aria-current="page">作品</a><a href="/posts/">文章</a><a href="/#learn">學習</a><a href="/#about">關於</a><a href="/#contact">聯絡</a></nav></header><div class="readbar"><nav aria-label="本頁段落"></nav><div class="fs" role="group" aria-label="調整字級"><span>字級 <b id="fs-label">標準</b></span><button type="button" data-fs="-1" aria-label="字級縮小">A−</button><button type="button" data-fs="1" aria-label="字級放大">A+</button></div></div><h1 class="t1" style="margin-top: 40px">作品</h1><p class="lead">每個作品一頁:為什麼做、它能做什麼、怎麼做出來、還不夠好的地方。</p><div style="margin: 28px 0 48px; border-top: 4px solid var(--ink)"><a href="/works/word-lens/" style="text-decoration: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 20px 0; border-bottom: 1px solid var(--ink)"><img src="/images/wordlens-cover.jpg" alt="宣傳圖:詞典的第一個意思,常常不是這句話的意思。例句中的 stick,詞典第一個意思是棍、棒,這句話裡是持續、留下來。" width="160" height="90" loading="lazy" style="object-fit: cover; border: 1px solid var(--ink)"><div style="flex: 1 1 260px; min-width: 0"><div style="font-family: var(--serif); font-size: calc(22px * var(--k)); font-weight: 900">點字學英文 Word Lens</div><div style="margin-top: 4px; font-size: calc(15px * var(--k)); line-height: 1.8; color: var(--soft)">讀英文時,雙擊卡住的那個字,就能看到它在「這句話裡」是什麼意思。</div></div><span class="tag">已上架</span></a></div><footer class="site-foot"><span>© Jasper 林禹丞</span><span>vanyuc0316@gmail.com ・ IG @vanyu.c</span></footer></div><script>
  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));
  })();
</script></body></html>
