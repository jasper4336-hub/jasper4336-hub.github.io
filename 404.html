</script><link rel="stylesheet" href="/_astro/Base.CotToWBB.css"></head><body><div class="wrap"><header class="site-head"><a class="logo" href="/">Jasper</a><nav class="site-nav" aria-label="主選單"><a href="/works/">作品</a><a href="/posts/">文章</a><a href="/#learn">學習</a><a href="/#about">關於</a><a href="/#contact">聯絡</a></nav></header><div class="readbar"><nav aria-label="本頁段落"></nav><div class="fs" role="group" aria-label="調整字級"><span>字級 <b id="fs-label">標準</b></span><button type="button" data-fs="-1" aria-label="字級縮小">A−</button><button type="button" data-fs="1" aria-label="字級放大">A+</button></div></div><h1 class="t1" style="margin-top: 40px">找不到這一頁</h1><p class="lead">網址可能打錯了,或這篇文章已經搬家。</p><div style="margin: 28px 0 64px; display: flex; flex-wrap: wrap; gap: 10px"><a class="btn primary" href="/">回首頁 →</a><a class="btn" href="/works/">看作品</a><a class="btn" href="/posts/">看文章</a></div><footer class="site-foot"><span>© Jasper 林禹丞</span><span>vanyuc0316@gmail.com ・ IG @vanyu.c</span></footer></div><script>
  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));
  })();
</script></body></html>
