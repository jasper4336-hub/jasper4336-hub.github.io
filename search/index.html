  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));

    // 深淺色切換：按鈕顯示目前是不是深色；手動選過就記住
    const tb = document.getElementById('theme-btn');
    const isDark = () => root.dataset.theme === 'dark';
    const show = () => tb.setAttribute('aria-pressed', String(isDark()));
    show();
    tb.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      show();
    });
    // 頁尾的臺灣時間，每分鐘更新
    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); };
    tick(); setInterval(tick, 30000);

    // 段落跟隨：捲到哪一段，段落列與側欄目錄就標出哪一段
    const links = [...document.querySelectorAll('.readbar nav a[href^="#"], .toc a[href^="#"]')];
    const targets = [...new Set(links.map((a) => decodeURIComponent(a.hash.slice(1))))]
      .map((id) => document.getElementById(id)).filter(Boolean);
    if (targets.length) {
      const bar = document.querySelector('.readbar nav');
      let current = '';
      // 讀者開啟「減少動態效果」時，段落列直接跳到位置，不做平滑捲動
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mark = () => {
        // 最後一個已經捲過畫面上方 1/4 的段落，就是目前在讀的段落
        const line = window.innerHeight * 0.25;
        let id = '';
        for (const t of targets) if (t.getBoundingClientRect().top <= line) id = t.id;
        if (id === current) return;
        current = id;
        for (const a of links) {
          const on = decodeURIComponent(a.hash.slice(1)) === id;
          a.classList.toggle('on', on);
          if (on) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
          // 段落列是橫向捲動的，把目前段落捲進可見範圍（不動到整頁）
          if (on && bar && bar.contains(a)) bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 3, behavior: still ? 'auto' : 'smooth' });
        }
      };
      let ticking = false;
      addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; mark(); }); } }, { passive: true });
      addEventListener('resize', mark);
      mark();
    }
  })();

  const input = document.getElementById('q');
  const status = document.getElementById('search-status');
  const list = document.getElementById('search-results');
  let pagefind;
  try {
    pagefind = await import(`${base}pagefind/pagefind.js`);
    await pagefind.init();
  } catch (e) {
    status.textContent = '搜尋索引還沒有建立（本機開發時沒有索引）。';
  }

  // Pagefind 斷詞後會在中文詞之間補空格（「批判 性 思考」），顯示前把中文字與標記之間的空格拿掉
  const cjk = '[\\p{Script=Han}\\u3000-\\u303f\\uff00-\\uffef]|<\\/?mark>';
  // 段落交界 Pagefind 會補「. 」，中文前後改回句號
  const tidy = (html) => html.replace(/(?<=\p{Script=Han}(?:<\/mark>)?)\.\s+/gu, '。').replace(new RegExp(`(?<=${cjk})\\s+(?=${cjk})`, 'gu'), '');
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let seq = 0;
  const run = async (term, push) => {
    const t = term.trim();
    if (push) history.replaceState(null, '', location.pathname + (t ? '?q=' + encodeURIComponent(t) : ''));
    if (!pagefind) return;
    const my = ++seq;
    if (!t) { list.innerHTML = ''; status.textContent = ''; return; }
    const res = await pagefind.debouncedSearch(t, {}, 200);
    if (res === null || my !== seq) return; // 已有更新的輸入
    const items = await Promise.all(res.results.slice(0, 12).map((r) => r.data()));
    if (my !== seq) return;
    status.textContent = items.length ? `找到 ${res.results.length} 篇` : `找不到「${t}」相關的內容,換個說法試試看。`;
    // excerpt 由 Pagefind 產生：內文已跳脫，只保留 <mark> 標出命中的字
    list.innerHTML = items.map((d) => `
      <li><a href="${esc(d.url)}">
        <span class="search-k">${esc(d.meta.kind || '')}</span>
        <span class="search-t">${esc(d.meta.title || d.url)}</span>
        <span class="search-x">${tidy(d.excerpt)}</span>
      </a></li>`).join('');
  };

  input.addEventListener('input', () => run(input.value, true));
  document.getElementById('search-form').addEventListener('submit', (e) => { e.preventDefault(); run(input.value, true); });
  const first = new URLSearchParams(location.search).get('q');
  if (first) { input.value = first; run(first, false); }
  input.focus();
</script>
