</script><link rel="stylesheet" href="/_astro/Base.CotToWBB.css"></head><body><div class="wrap"><header class="site-head"><a class="logo" href="/">Jasper</a><nav class="site-nav" aria-label="主選單"><a href="/works/">作品</a><a href="/posts/" aria-current="page">文章</a><a href="/#learn">學習</a><a href="/#about">關於</a><a href="/#contact">聯絡</a></nav></header><div class="readbar"><nav aria-label="本頁段落"></nav><div class="fs" role="group" aria-label="調整字級"><span>字級 <b id="fs-label">標準</b></span><button type="button" data-fs="-1" aria-label="字級縮小">A−</button><button type="button" data-fs="1" aria-label="字級放大">A+</button></div></div><h1 class="t1" style="margin-top: 40px">文章</h1><p class="lead">作品介紹、應用、學習筆記與心得。每篇都標出依據:實測、依官方資料整理,或個人看法。</p><div style="margin: 28px 0 48px; border-top: 4px solid var(--ink)"><a href="/posts/word-lens-how-to/" style="text-decoration: none; display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 22px 0; border-bottom: 1px solid var(--ink)"><div style="flex: 0 0 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700"><span style="color: var(--accent-ink)">應用</span><span style="color: var(--muted)">2026-10-20</span></div><div style="flex: 1 1 360px; min-width: 0"><div style="font-family: var(--serif); font-size: calc(22px * var(--k)); font-weight: 900; line-height: 1.5">讀英文文章卡住時,我怎麼用點字學英文一路讀完</div><div style="margin-top: 6px; font-size: calc(16px * var(--k)); line-height: 1.85; color: var(--soft)">從查一個字、看懂一句話,到把生字存起來、隔天複習。四個步驟,第一次大約五分鐘就能上手。</div></div><span class="tag" style="align-self: flex-start">實測</span></a></div><footer class="site-foot"><span>© Jasper 林禹丞</span><span>vanyuc0316@gmail.com ・ IG @vanyu.c</span></footer></div><script>
  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));
  })();
</script></body></html>
