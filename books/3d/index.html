pan class="cta-t">聯絡</span></a></div></div><div class="s3d"><h1 class="t1" style="margin-top: 40px">書架・立體模式</h1><p class="lead">2024 年夏天開始的書架，照讀完的時間由左往右排。</p><p class="s3d-tools"><a href="/books/">← 回文字版書架</a></p><noscript><p>立體模式需要 JavaScript。請改看<a href="/books/">文字版書架</a>。</p></noscript><div class="shelf-wrap"><aside class="memo" aria-label="使用說明"><b>怎麼翻這個書架</b><ol><li>點一本書，把它拿下來</li><li>拖曳可以轉動</li><li>按箭頭、點書或左右滑動就能翻開、翻頁</li><li>按「放回書架」、Esc，或闔上後點書外放回去</li></ol><p>翻開後依序是書目、一句話推薦和我的短評。短評是我讀書時從筆記中挑出來的小結，和文字版書架的內容相同。</p></aside><div class="room"><div class="case" id="case" aria-label="書架，共 33 本"></div></div></div><div class="stage" id="stage" role="dialog" aria-modal="true" aria-labelledby="cap-t"><div class="scrim"></div><div class="floor"></div><div class="cap"><b id="cap-t"></b><span id="cap-s"></span></div><div class="holder" id="holder"></div><div class="bar"><button type="button" id="b-back">放回書架</button><button type="button" id="b-prev" aria-label="上一頁">‹</button><span class="pos" id="pos" aria-live="polite"></span><button type="button" id="b-next" aria-label="下一頁">›</button><button type="button" id="b-open" class="main">翻開</button></div></div></div><script type="application/json" id="s3d-data">[{"id":"our-inner-conflicts","no":"B003","title":"我們內心的衝突","author":"卡倫・荷妮（Karen Horney）","translator":"李娟","publisher":"小樹文化","year":2019,"isbn":"9789570487114","category":"心理與人際","read":"2024-07","oneLine":"童年經歷會影響人，但人一輩子都擁有改變自己的能力。","review":["這是一本精神分析的經典，讀起來不輕鬆，我的筆記大多是幫自己整理的小標：阻力與推力、怎麼開導絕望、什麼叫負責、關於理想。","書裡最核心的概念是「理想化形象」：人為了逃避內心的衝突，在心裡替自己塑造一個完美的樣子，再深信自己就是那個樣子。作者也指出，很多人害怕改變，其實是害怕失去這個形象。","讓我安心的是作者的結論：童年經歷會影響人，但人終身擁有改變自己的能力。治療的目標是找回自己、形成自己的價值觀，再在自己的感受和信念上，和他人建立關係。"],"t":{"w":14.8,"h":21,"t":2.35,"pages":368,"img":1.641,"spine":true,"color":"#d7d6ce","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/our-inner-conflicts-front.webp","spineUrl":"/images/books/3d/our-inner-conflicts-spine.webp"}},{"id":"songchigan","no":"B017","title":"鬆弛感：成為有辦法的人","author":"胡漸彪","publisher":"中信出版集團","year":2023,"isbn":"9787521754650","category":"心理與人際","read":"2024-07","oneLine":"狀態會隨著對環境、對自己、對行動的評價而改變。","review":["這本書我讀的時候大多在劃線，自己寫下的話只有一句：一個人的狀態，會隨著他對所處環境、對自身，以及對自身行動的評價而改變。","重讀劃線之後，我替這本書留下兩個小結。首先，鬆弛感不是什麼都不在乎，而是看清事物的本質和代價之後，自然做出的選擇與取捨，所以遇到問題時能從容應對。再者，把焦慮拆成具體的小事——化大為小，一次只完成一小步。焦慮常來自抽象的想像，拆成容易執行的小任務，就不會感到焦慮，遲遲不行動了。"],"t":{"w":13,"h":19,"t":1.14,"pages":227,"img":1.462,"spine":true,"color":"#f2f2ef","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/songchigan-front.webp","spineUrl":"/images/books/3d/songchigan-spine.webp"}},{"id":"xiaochang","no":"B025","title":"笑場","author":"李誕","publisher":"湖南文藝出版社","year":2017,"isbn":"9787540481827","category":"文學","read":"2024-07","oneLine":"做個無情，但有愛的人。","review":["老實說，有些地方我覺得看著沒意思，挺拖沓，但看著看著也就看完了。李誕還是很幽默的，不是因為別人這麼說，而是看完這本書後，我對他這個人的感受。有幾篇短篇故事很發人省思，也有許多有意思的角度和描寫；最後的詩頗具特色，至少我是挺喜歡的。謝謝李誕給我的七月帶來了意思。","讀到溫水煮青蛙那篇，我寫下：我們最終能控制的不是自己在哪口鍋中，而是只能努力嘗試，努力地把控制火候的開關，給擰小一點，再小一點，好讓自己這一生好受點。","還有一則是關於人情：被動接受人的好意，常常積累出的是難以說出口的壓力，就像被不存在的靈體要脅著還債一樣，欠的越來越多，卻無法歸還；只有對方做出了對不起自己的事時，侷促的心才頓時放鬆下來，因為自己同對方已兩不相欠。"],"t":{"w":14.5,"h":20.7,"t":1.6,"pages":300,"est":true,"img":1.428,"spine":false,"color":"#e6e3dc","ratio":1.4275862068965517,"fit":"100% 100%","frontUrl":"/images/books/3d/xiaochang-front.webp","spineUrl":""}},{"id":"tender-is-the-night","no":"B026","title":"夜未央","author":"史考特・費茲傑羅（F. Scott Fitzgerald）","translator":"劉霽","publisher":"一人出版社","year":2026,"isbn":"9786269927661","category":"文學","read":"2024-09","oneLine":"別太常去揣測或預想他人怎麼看待自己。","review":["讀這本書時，我常把喜歡的段落改寫成自己的句子，像是：她微笑，一個令時間停止流動的微笑，就像世上關於美的所有解釋都為它而存在。","也有幾則是寫給自己的提醒。找出一個人值得自己尊重的地方，能避免落入彬彬有禮、卻無法分辨此人是否值得結交的困惑中。","讀到書裡說，東西應該屬於喜歡它們的人，我寫下：願每個人也都屬於真正喜歡他們的人。"],"t":{"w":14,"h":20.6,"t":2.5,"pages":480,"img":1.472,"spine":false,"color":"#451213","ratio":1.4714285714285715,"fit":"100% 100%","frontUrl":"/images/books/3d/tender-is-the-night-front.webp","spineUrl":""}},{"id":"fanshi-fasheng","no":"B015","title":"凡事發生皆有利於我","author":"廖恆","publisher":"人民郵電出版社","year":2024,"isbn":"9787115646286","category":"心理與人際","read":"2025-02","oneLine":"行動才是解決內耗的唯一途徑。","review":["很諷刺的是，我是在一個睡不著的夜裡讀到這本書的，花了兩個小時讀完。我一直清楚自己是個拖延的人，書裡的方法給我指了一條明路：先想清楚自己當下能夠開始的行動，再合理規劃怎麼達成目標。","我給自己寫下的小標都很直接：行動才是解決內耗的唯一途徑；長期主義是人生的重要價值觀念；事情有可控區、影響區和不可控區；發生事情不要第一時間怪別人，先從自己身上找原因；解決不了的問題，盡了最大努力、不留遺憾之後，就交給時間。","最後是寫給自己的一段話：把精力當成有限的資源去管控，行動優先，而不是追求完美的計畫，遇到問題再見招拆招。遇到的問題，都是在教你怎麼解決問題。"],"t":{"w":13,"h":19,"t":1.06,"pages":212,"img":1.446,"spine":false,"color":"#f4f4f2","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/fanshi-fasheng-front.webp","spineUrl":""}},{"id":"shejiao-xinfa","no":"B016","title":"社交心法","author":"恆洋","publisher":"台海出版社","year":2024,"isbn":"9787516840689","category":"心理與人際","read":"2025-02","oneLine":"做人的核心是尊重人，做人的支撐是責任心。","review":["這本很實用，我在旁邊寫最多的是「謹記」和「要放在心上」：養成送禮的習慣、做人的禮儀、真誠的讚美與小心的評論、不隨意批評自己不了解的事、養成付費的習慣，別想著佔便宜。","讓我想最久的是真誠和虛偽的差別：是為了某個目的才這樣做，還是把這樣的行為貫徹在日常生活中，不分熟生。另外，我也把「做人的核心是尊重人，做人的支撐是責任心」記了下來。","溝通上，我提醒自己：要尊重對方的想法，而不是想著說服人。想鼓舞別人時，可以從對方曾經面對過的挑戰聊起，讓對方講講人生中最深刻的克服困難的時刻。"],"t":{"w":13,"h":19,"t":1.23,"pages":246,"img":1.462,"spine":true,"color":"#d32425","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/shejiao-xinfa-front.webp","spineUrl":"/images/books/3d/shejiao-xinfa-spine.webp"}},{"id":"finite-and-infinite-games","no":"B018","title":"有限與無限的遊戲：從遊戲與變幻透視人生","author":"詹姆斯・卡斯（James P. Carse）","translator":"葉家興","publisher":"大塊文化","year":2024,"isbn":"9786267483015","category":"哲學","read":"2025-02","oneLine":"對話是為了繼續，如此才得以相互理解。","review":["讀到談旅行的段落時，我寫下：旅行不是到達一個目的地，真正的旅行發生在無時無刻，發生在旅行者的心中。旅行，即在生活中成長。","另一則是寫給自己的提醒：對話中永遠照顧到聆聽者的感受，並適當的留白；積極的吸收聆聽者的反饋，才能成就一段雙向對話的關係。"],"t":{"w":14.8,"h":20,"t":1,"pages":192,"img":1.35,"spine":true,"color":"#e9b42c","rtl":true,"vt":true,"ratio":1.3513513513513513,"fit":"100% 100%","frontUrl":"/images/books/3d/finite-and-infinite-games-front.webp","spineUrl":"/images/books/3d/finite-and-infinite-games-spine.webp"}},{"id":"the-war-of-art","no":"B002","title":"一生之敵","author":"史蒂文・普雷斯菲爾德（Steven Pressfield）","translator":"趙碩碩","publisher":"上海文藝出版社","year":2024,"isbn":"9787553530215","category":"自我成長","read":"2025-03","oneLine":"把熬夜滑短影片的時間拿來讀它，是我做過最划算的一筆交易。","review":["我花了一天讀完，讀完心情像被解放了。如果這是一場時間的交易，我用曾經熬夜刷短影片的時間，換來和一位在人生路上走了很久的人進行一場無聲的交流，得到豁然開朗的滿足感，太划算了。","「內阻力」是很好的比喻，讓我第一次換個角度看見：在找到那個注定要成為的自己的路上，會遇到什麼樣的阻礙。書裡很多地方我都在旁邊寫下自己的話：持續做，比努力做還要緊；不用過分認同自己熱愛的事，行動才是對它真正的認同；越是不想面對、越害怕的事，往往就是必須做的事。","最後記下的一句是：你隨時都可以開始。"],"t":{"w":13,"h":19,"t":1.2,"pages":175,"est":true,"img":1.497,"spine":true,"color":"#f2f2f2","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/the-war-of-art-front.webp","spineUrl":"/images/books/3d/the-war-of-art-spine.webp"}},{"id":"the-knowledge","no":"B019","title":"最後一個知識人：末日之後，擁有重建文明社會的器物、技術與知識原理","author":"路易斯・達奈爾（Lewis Dartnell）","translator":"蔡承志","publisher":"臉譜","year":2022,"isbn":"9786263151017","category":"社會與媒介","read":"2025-03","oneLine":"以科學方法為發語詞，盼宇宙能以現象應答。","review":["我是邊查資料邊讀完這本書的，沒想到花了這麼多時間。我覺得很值得，這本書引領我從一個「或許」會發生的災難性視角中，理解構成當今繁榮社會的關鍵要素，還有它們如何被發現？又怎麼被實現？我並不覺得自己在讀過一遍，就能夠完全理解書中的龐大資訊。但是，透過對於人類社會從農業、糧食、服裝、材料、醫藥、能源、交通、通訊、化學、時令以及科學方法上，建構出來的知識體系，和支撐這套體系的種種前提，我心中有一種源源不絕的滿足感湧出，幸好——我所成長的這個年代是如此的繁榮、發達且和平。希望不會有需要用到這本書的那一天。","讀到文明崩解後的社會時，我也寫下：使社會凝聚的部分原因是，欺騙與暴力行為所帶來的短期利益遠不及其帶來的長期後果。所以大多數人們不會選擇那麼做，但這僅限於社會契約還能有效運作的情況下。"],"t":{"w":14.8,"h":21,"t":1.7,"pages":320,"img":1.419,"spine":true,"color":"#e6e6e2","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/the-knowledge-front.webp","spineUrl":"/images/books/3d/the-knowledge-spine.webp"}},{"id":"red-pony","no":"B027","title":"小紅馬","author":"約翰・史坦貝克（John Steinbeck）","translator":"李劍敏","publisher":"上海譯文出版社","year":2019,"isbn":"9787532779437","category":"文學","read":"2025-03","oneLine":"四個故事中，最令我印象深刻的是第三則〈承諾〉。","review":["失去了小紅馬加比蘭的喬迪，就像曾經答應給我們買什麼又失約的父母一樣，對於眼中可靠又不可冒犯的大人，既想相信，又感到擔心。曾經因為判斷失誤、間接造成加比蘭病逝的比利，在那之後也不再如往日般自信、語帶肯定。","母馬分娩出了問題，比利在心中經過劇烈的權衡與掙扎之後，用書中最血腥的方式兌現了承諾，把一匹初生的小黑駒交給喬迪。喬迪本該為終於得到夢寐以求的馬兒而開心，但看著比利的樣子，他只是愣在那，久久說不出話來。","這篇故事把比利不想再承受違背承諾、心中無可奈何而做出的舉動，描寫得深刻、隱晦，又令人久久不能忘懷。"],"t":{"w":14,"h":21,"t":1.1,"pages":166,"est":true,"img":1.5,"spine":false,"color":"#b5161c","ratio":1.5,"fit":"100% 100%","frontUrl":"/images/books/3d/red-pony-front.webp","spineUrl":""}},{"id":"kokoro","no":"B028","title":"心：夏目漱石探究人心幽暗面的懺情錄","author":"夏目漱石","translator":"林皎碧","publisher":"大牌出版","year":2022,"isbn":"9786267102992","category":"文學","read":"2025-03","oneLine":"愧疚一旦無從彌補，便再也沒有期限。","review":["讀《心》的那天，那段討論「理論家」與「實踐家」的句子，說的就是先生，也有一點像我自己：有些事，明明道理都懂，到了該做的時候卻退縮。先生一生背著對 K 的愧疚，直到遺書才說出口。","我們總是在討論愛情，但愛情已經不是過去的模樣，它鮮少再以從前的面貌示人。愛情更多地只存在於我們的心中，即我們如何看待它。","後來聽到賈行家老師在《年度人文課堂 2》談愛情，說關鍵不在條件，也不在遇見誰，而在自己開始投入地去愛，並承擔這個選擇。先生做了選擇，卻用一輩子逃避承擔它，這或許就是這本書讓我讀完還放不下的地方。"],"t":{"w":14.8,"h":21,"t":1.8,"pages":280,"img":1.419,"spine":true,"color":"#785b55","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/kokoro-front.webp","spineUrl":"/images/books/3d/kokoro-spine.webp"}},{"id":"perfume","no":"B029","title":"香水","author":"徐四金（Patrick Süskind）","translator":"洪翠娥","publisher":"皇冠","year":2025,"isbn":"9789573342670","category":"文學","read":"2025-03","oneLine":"一個沒有氣味的人，用氣味統治了所有人。","warning":"內容涉及連續謀殺與身體描寫，閱讀前請留意；未成年讀者建議有大人陪伴。","review":["讀這本書，我第一次認真想氣味有多重要：人可以閉上眼睛、摀住耳朵，卻沒辦法拒絕吸進來的空氣。葛奴乙擁有天才的鼻子，卻沒有自己的味道；他做出了讓所有人愛他的香水，自己卻始終得不到被愛的感覺。","故事設在十八世紀的法國，從葛奴乙出生的巴黎魚市場，一路走到南法的香水小城格拉斯。徐四金在 1985 年用德文寫下它，把一段虛構的人生放進很真實的歷史場景裡。當時我便意識到，這可以是一則關於權力的寓言：真正能控制人的，往往不是道理，而是繞過思考、直接進到身體裡的東西。放到今天，氣味或許換成了精心包裝的形象和不斷推送的內容，我們也一樣很難閉上眼睛。","不過這本書真的是想像力的盛宴，很享受那些對於氣味和各種古典象徵的精確描述，還有結局中那令人唏噓的黑色幽默。2006 年也拍成了電影，由湯姆・提克威（Tom Tykwer）執導。"],"t":{"w":14.8,"h":21,"t":1.68,"pages":336,"img":1.419,"spine":true,"color":"#9db9b2","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/perfume-front.webp","spineUrl":"/images/books/3d/perfume-spine.webp"}},{"id":"psychology-of-selling","no":"B014","title":"銷售中的心理學","author":"博恩・崔西（Brian Tracy）","translator":"王有天、彭偉","publisher":"北京聯合出版公司","year":2017,"isbn":"9787550282537","category":"心理與人際","read":"2025-05","oneLine":"先成為朋友，再成為客戶：銷售的基石是信任。","review":["這本書我讀了兩個多月，筆記裡留了很多寫給自己的小標：要戰勝自己，才能贏得別人；對自己實事求是；要讓自己成為值得信任的人；終生學習。","談實務的部分，我記下的是：成為朋友，再成為客戶；建立信任關係是任何銷售行為的基石；價格最後才談；禮貌且執著。還有一條我特別喜歡：去察覺對方的個性，調整自己去面對客戶，不要把對方當成和自己同類型的人，先觀察，後行動。","當時我曾這麼想過：對於即將啟程的銷售生涯，希望在實踐的過程中能體會人生、社會與現實，並且以成為頂尖銷售為目標，定期回來閱讀這本給了我許多啟發的書。"],"t":{"w":14.8,"h":21,"t":1.3,"pages":225,"est":true,"img":1.431,"spine":false,"color":"#3d6b2c","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/psychology-of-selling-front.webp","spineUrl":""}},{"id":"jingjin","no":"B001","title":"精進：如何成為一個很厲害的人","author":"采銅","publisher":"江蘇鳳凰文藝出版社","year":2016,"isbn":"9787539990484","category":"自我成長","read":"2025-06","oneLine":"學習要能用在現實裡才算數：這本書讓我開始把「想」換成「做」。","review":["對我最有用的一句話，是我自己改寫的：只有最後能作用於現實的學習，才是有效的學習。學習不全靠記憶，要在現實裡應用、產出，再從實踐裡反思，回頭引導下一次實踐。","書裡談到動力消退時人就會拖延，我在旁邊寫了「這是我呢」。後來給自己的提醒很簡單：行動大於空想，用行動取代逃避，小事能處理就先處理掉。也開始練習在「近未來」和「遠未來」之間取得平衡，問自己五年後想成為怎樣的人，再放下對未來的執念，聚焦眼前。","知道自己想做什麼、專精在哪裡，並且持之以恆地做，我覺得是這個時代最可貴的品質之一。"],"t":{"w":14.5,"h":21,"t":1.9,"pages":291,"est":true,"img":1.462,"spine":false,"color":"#fbf9ea","ratio":1.4482758620689655,"fit":"100% 100%","frontUrl":"/images/books/3d/jingjin-front.webp","spineUrl":""}},{"id":"renxing-de-aomi","no":"B013","title":"人性的奧秘：曾仕強談人性的弱點","author":"曾仕強","publisher":"北京聯合出版公司","year":2014,"isbn":"9787550235151","category":"心理與人際","read":"2025-06","oneLine":"看懂人性的弱點，才知道該怎麼修養自己。","review":["讀這本時，我替自己整理了「人性的三層弱點」：先是求生存，因為求生存而顧自己，使人貪生、怕死；接著是自私，表現為貪名、貪利；追求名利之後，最後是追求快樂，使人變得好競爭。","另外幾個小標是我讀完還記得的：資訊發達的代價、自由與穩定的取捨、內斂的涵養。還有一句寫給自己的：做個有理想的人，對人生、對社會、對價值抱有理想。"],"t":{"w":14.8,"h":21,"t":0.9,"pages":152,"est":true,"img":1.444,"spine":true,"color":"#d9d9d9","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/renxing-de-aomi-front.webp","spineUrl":"/images/books/3d/renxing-de-aomi-spine.webp"}},{"id":"invitation-to-anthropology","no":"B020","title":"人類學的邀請：認識自我和他者（第 4 版）","author":"盧克・拉斯特（Luke Eric Lassiter）","publisher":"北京大學出版社","year":2021,"isbn":"9787301304624","category":"社會與媒介","read":"2025-06","oneLine":"性別的生物性，是不同社會文化中各種行為、角色和意義的基礎。","review":["這本書我讀的時候大多在劃線，自己寫下的是幾個小標：文化是什麼、經驗的形成與意義、文化在人類學上的定義、對於宗教信仰於懷疑傳統的反思。","比較完整的一句是：性別的生物性為人類建立起不同社會文化中的各種文化行為、角色和意義的基礎。","讀完之後，我對文化的理解變了：它不是一套固定的答案，而是模糊、混亂、會變動的，因為人就是這樣。青春期的叛逆、種族的分類，許多我以為天生的東西，其實是文化塑造出來的。也因此，認識他者之前，要先放下自己的理論，去了解對方如何定義這個世界；在交談中，原本模糊的共享經驗被打破，差異才會浮現。"],"t":{"w":13,"h":19,"t":1.71,"pages":342,"img":1.462,"spine":true,"color":"#313d8b","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/invitation-to-anthropology-front.webp","spineUrl":"/images/books/3d/invitation-to-anthropology-spine.webp"}},{"id":"thousand-cranes","no":"B030","title":"千羽鶴","author":"川端康成","translator":"劉子倩","publisher":"木馬文化","year":2023,"isbn":"9786263144262","category":"文學","read":"2025-06","oneLine":"「死是對一切理解的拒絕。」要珍惜還能理解身邊重要的人的機會，方不至於後悔莫及。","review":["書中的人被過去所牽絆：菊治放不下父親留下的關係，文子放不下母親的死。「死是對一切理解的拒絕」，因為逝去的人再也不能解釋，活著的人再也得不到回答，或許這也算一種倖存者的負擔吧。書裡也說，逝者不會把道德強加在生者身上，放不下的其實是活著的人。","最讓我記得的是那只志野茶碗。它是太田夫人用過的，碗口留著擦不掉的口紅印；菊治把父親的茶碗擺在一旁，兩人才明白，這是上一代情人用過的一對。最後文子把它摔碎在石頭上。川端康成在諾貝爾獎演說中提過，如果把這部小說讀成對茶道之美的禮讚，就讀錯了，它其實是一部否定之作，懷疑並警示茶道淪為庸俗。知道這一點之後，我不再只把茶碗看成美的象徵：它盛著的，是上一代留下、下一代還放不下的東西。"],"t":{"w":14.8,"h":21,"t":2.1,"pages":328,"img":1.419,"spine":true,"color":"#763f41","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/thousand-cranes-front.webp","spineUrl":"/images/books/3d/thousand-cranes-spine.webp"}},{"id":"amusing-ourselves-to-death","no":"B004","title":"娛樂至死","author":"尼爾・波茲曼（Neil Postman）","translator":"蔡承志","publisher":"貓頭鷹出版","year":2016,"isbn":"9789862622988","category":"社會與媒介","read":"2025-07","oneLine":"想知道短影音為什麼讓人停不下來，先讀這本四十年前寫電視的書。","review":["媒介像是水，訊息是水裡的魚：水的性質決定了魚怎麼游，也就是訊息怎麼被傳遞、被理解。波茲曼談的是電視，但我讀的時候一直想到現在的短影音。今天有人提醒短影片會傷害注意力和學習能力，常會被質疑；沉浸其中的人不覺得有害，也不喜歡被說自己的習慣有影響。","「劣幣驅逐良幣」不只發生在經濟上，也發生在我們交流的媒介裡：簡單取代了複雜，因為它更貼近人性裡怕麻煩的那一面。書本讓人用比較嚴謹的方式認識世界；而在被訊息淹沒的網路上，我們只能有限地過濾，盡量留下和自己有關的。","讀完我最大的收穫是：先意識到媒介本身帶著什麼隱喻，才可能對它有一點控制。要找回公共討論裡的理性和思考，只能從自我察覺開始。"],"t":{"w":14.8,"h":21,"t":4.26,"pages":304,"img":1.647,"spine":true,"color":"#2e2e2e","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/amusing-ourselves-to-death-front.webp","spineUrl":"/images/books/3d/amusing-ourselves-to-death-spine.webp"}},{"id":"renji-de-aomi","no":"B011","title":"人際的奧秘：曾仕強告訴你如何搞好人際關係","author":"曾仕強","publisher":"北京聯合出版公司","year":2014,"isbn":"9787550237872","category":"心理與人際","read":"2025-07","oneLine":"觀念決定關係：要影響別人，先從改變自己的立場開始。","review":["這是我在曾仕強三本「奧秘」裡劃線最多的一本。讀的時候給自己下的小標，大多是提醒：觀念決定關係，站在改變自己的立場，才能去影響他人；別總是把責任推給他人，有過錯就透過檢討自己來補救，率先承認錯誤總歸是不壞的。","談溝通的部分，我寫下：每個人在生活中都有不同的內在邏輯，溝通的意義就在於讓人們能彼此理解；在了解對方的觀念之前，不要在心中隨意評判一個人。還有一句提醒自己：總是聚焦在形式上，就會丟失關注問題本質的能力。如果對方真的是為了自己好、言之有物，就不要過於計較口氣與態度。","最後歸結成一句很樸素的話：誠懇待人、重誠信、不傷害他人，是務實之本。"],"t":{"w":14.8,"h":21,"t":1.3,"pages":218,"est":true,"img":1.444,"spine":true,"color":"#2e2a28","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/renji-de-aomi-front.webp","spineUrl":"/images/books/3d/renji-de-aomi-spine.webp"}},{"id":"qingxu-de-aomi","no":"B012","title":"情緒的奧秘：曾仕強告訴你不生氣的活法","author":"曾仕強","publisher":"北京聯合出版公司","year":2014,"isbn":"9787550233393","category":"心理與人際","read":"2025-07","oneLine":"情緒管理的第一步是反求諸己：做個情緒穩定的人。","review":["這本我大多是劃線，自己寫下的小標不多，但每一個都很短：反求諸己、要引以為戒、做個情緒穩定的人。「做個情緒穩定的人」我寫了兩次。","另一句寫給自己的提醒是：選擇先勇於承認錯誤。"],"t":{"w":14.8,"h":21,"t":1,"pages":170,"est":true,"img":1.434,"spine":false,"color":"#1e1c1b","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/qingxu-de-aomi-front.webp","spineUrl":""}},{"id":"symposium","no":"B031","title":"論愛美與哲學修養：柏拉圖《會飲篇》","author":"柏拉圖（Plato）","translator":"朱光潛","publisher":"五南","year":2024,"isbn":"9786263934665","category":"哲學","read":"2025-07","oneLine":"愛不單指男女情愛，而是人們不論年齡都會永恆追求的。","review":["在一場宴會中，蘇格拉底與其他談話者輪流頌揚愛神，進而探討愛的本質。最後蘇格拉底推翻了前面所有人的論點，引出「愛是追逐永恆的美」：從小培養審美，到覺察不同行為、各種知識之美，最後觸及「美本身」。好比我們從看山是山，到看山不是山，最終領悟山的本質一般。","愛不單指男女情愛，而是渴望生育肉體或靈魂的後代，以達到不朽。或許透過對美的追求，我們能從男女情愛之外，理解所謂「愛」的不同面貌。"],"t":{"w":11,"h":17,"t":0.7,"pages":160,"img":1.547,"spine":true,"color":"#eeeeec","rtl":true,"vt":true,"ratio":1.5454545454545454,"fit":"100% 100%","frontUrl":"/images/books/3d/symposium-front.webp","spineUrl":"/images/books/3d/symposium-spine.webp"}},{"id":"boyilun","no":"B021","title":"博弈論：每個人都能成為決策高手","author":"蔣文華","publisher":"北京聯合出版公司","year":2021,"isbn":"9787559651433","category":"職場與決策","read":"2025-10","oneLine":"博弈，是雙方基於某種狀態對彼此所做出的決策。","review":["筆記裡記下的一個例子是剪刀石頭布的策略：輸的話，出上一把能贏對方的；贏的話，出上一把對方出的。","讀完之後，我對信任多了一層理解：它有條件，目標或利益一致，才是彼此信任的基礎。習俗、文化、道德和法律，也都是讓人用比較低的成本找到共同的落點。要化解個人和集體之間的衝突，靠的不是否定每個人的盤算，而是修改遊戲規則。只是規則並不好改：舊規則背後有習慣它、從中得利的人，新規則需要時間磨合，改變的過程中，總有人得先承擔損失。看懂這一點，我才明白很多問題遲遲沒有解決，不是因為沒人想到答案，而是改變的代價不一定有人願意承擔。"],"t":{"w":14.6,"h":21,"t":1.5,"pages":272,"est":true,"img":1.439,"spine":false,"color":"#f4f4f2","ratio":1.4383561643835616,"fit":"100% 100%","frontUrl":"/images/books/3d/boyilun-front.webp","spineUrl":""}},{"id":"zhixing-heyi","no":"B022","title":"知行合一王陽明：心學日課 21 天","author":"度陰山","publisher":"江蘇鳳凰文藝出版社","year":2024,"isbn":"9787559487025","category":"哲學","read":"2025-12","oneLine":"但行好事，莫問前程。","review":["讀這本書時，我在一則筆記寫下：這是我想走的道。也寫下另一個想法：許多人沒辦法認同，或認同了但做不到，這點大概就是被物質至上的環境慣性影響吧。","留給自己的提醒是兩個小標：內自省之重；蹇以反身，困以遂志。"],"t":{"w":14.7,"h":21,"t":1.55,"pages":310,"est":true,"img":1.431,"spine":false,"color":"#16120f","ratio":1.4285714285714286,"fit":"100% 100%","frontUrl":"/images/books/3d/zhixing-heyi-front.webp","spineUrl":""}},{"id":"agony-of-eros","no":"B007","title":"愛欲之死","author":"韓炳哲（Byung-Chul Han）","translator":"管中琪","publisher":"大塊文化","year":2022,"isbn":"9786267118481","category":"社會與媒介・哲學","status":"推薦","read":"2026-01","oneLine":"當愛變成可以挑選、可以優化的選項，我們也慢慢失去了愛的能力。","review":["比預期花了更長的時間才讀完，很欣賞韓炳哲思考的深度和廣度。如果你對愛情、人、當代社會之間的關係感到困惑，對它們的模式從哪裡來感到好奇，這本書會給你一個貼切、邏輯自洽的回答，至少能讓你換一個角度看。對很少讀哲學的我來說有點挑戰，但作者的語言還是很適合普通人閱讀。","最有感的是「效率社會」那部分：一切都變成可能性，愛被當成一個可以選擇的選項，關係被當成可以優化的項目。我在筆記裡寫下一句：愛無法量化。","我也在一段話旁邊寫了「就是在說你呢」：人的內心也是一個小世界，想要通透、有深度，就要學會避開噪音，習慣在獨處中探險。"],"t":{"w":14,"h":20,"t":1,"pages":96,"img":1.609,"spine":true,"color":"#a992ab","rtl":true,"vt":true,"ratio":1.4285714285714286,"fit":"100% 100%","frontUrl":"/images/books/3d/agony-of-eros-front.webp","spineUrl":"/images/books/3d/agony-of-eros-spine.webp"}},{"id":"burnout-society","no":"B006","title":"倦怠社會","author":"韓炳哲（Byung-Chul Han）","translator":"莊雅慈、管中琪","publisher":"大塊文化","year":2015,"isbn":"9789862135976","category":"社會與媒介・哲學","read":"2026-02","oneLine":"以為自己很自由，其實是自己在逼自己：這本小書把這件事說得很準。","review":["這本書很薄，但有幾段讓我覺得被描述得太精闢了，因為那正是很多人的日常：趁著流量時代的紅利還沒用完，選擇行銷自己、累積名聲來謀生，換取更好的生活條件、機會和人脈。在臉書上展示自我，也就是把自己變成了商品。","書裡說的「功績主體」以為自己是自由人，卻在效率的禁令下自己剝削自己。我讀完的提醒是：現代人或許需要重新學會停留，也不要停止去發現生命中的意義。","最喜歡的一個連結是「星期天的由來」：那原本是什麼都不做、從目的中解放出來的一天。"],"t":{"w":14,"h":20,"t":0.58,"pages":116,"img":1.625,"spine":true,"color":"#e4d6d1","rtl":true,"vt":true,"ratio":1.4285714285714286,"fit":"100% 100%","frontUrl":"/images/books/3d/burnout-society-front.webp","spineUrl":"/images/books/3d/burnout-society-spine.webp"}},{"id":"in-the-swarm","no":"B008","title":"在群中：數字媒體時代的大眾心理學","author":"韓炳哲（Byung-Chul Han）","translator":"程巍","publisher":"中信出版社","year":2019,"isbn":"9787508696911","category":"社會與媒介・哲學","read":"2026-02","oneLine":"十多年前寫的數位媒體批判，放到今天的短影音時代一點也不過時。","review":["韓炳哲寫這本書時還沒有短影音，但我讀的時候一直對應到現在的腦腐內容：沒有意義，卻傳播得很快。真有預見性。","書裡有兩章接在一起讀很有意思。〈從經手到動指〉說，取代手的是手指：人越來越只動指尖，真正的行動也跟著變少。接著的〈從農夫到獵人〉用了一組比喻：過去的人像農夫，耕地要照料、要等待，就像知識得靠長期的經驗累積，而且不會一眼就看見；今天的人則像獵人，在網路這片「數字獵場」裡遊蕩，沒有耐心，只求每一次點擊都有獵物入袋，捕到的多半是來得快、去得也快的資訊。舊石器時代的獵人拿著矛和弓箭、得冒生命危險，新的獵人手裡只有滑鼠，獵的是資訊。","讀到這裡，我在旁邊寫：原來還可以這樣說。那我們狩獵也不再只是為了生存，而是把獵物當成緩解生活焦慮和疲憊的精神食糧。這也加深了我們對數位設備的依賴，讓我們更難在大量、品質參差的資訊裡，得到真正有用的東西，而不是雜訊。","還有一段談對視：直接的四目相對是一種美好，你在看別人的同時也被看著。可惜這種美好越來越少見，疏於對視的人，甚至可能開始害怕和人對視。"],"t":{"w":13,"h":19,"t":1,"pages":117,"img":1.431,"spine":false,"color":"#cbb55c","ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/in-the-swarm-front.webp","spineUrl":""}},{"id":"five-people-heaven","no":"B032","title":"在天堂遇見的五個人","author":"米奇・艾爾邦（Mitch Albom）","translator":"栗筱雯","publisher":"大塊文化","year":2004,"isbn":"9789867600790","category":"文學","read":"2026-03","oneLine":"成全自己，更是成全他人。","review":["讀這本書時，我一直想到成全：犧牲一件寶貴的東西，並不是真正失去它，只是把它傳遞給了另一個人。","所有的生命都是相互關聯的，而心會反映出你我所見的世界是什麼樣子的。所以我提醒自己：請多多照看身邊的人吧，親人、友人、情人甚至陌生人，我們總能從與他人的互動中找到某種意義。"],"t":{"w":14.8,"h":21,"t":1.36,"pages":272,"img":1.349,"spine":false,"color":"#e9dd99","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/five-people-heaven-front.webp","spineUrl":""}},{"id":"fang-si-chi","no":"B009","title":"房思琪的初戀樂園","author":"林奕含","publisher":"游擊文化","year":2025,"isbn":"9786269917457","category":"文學","read":"2026-05","oneLine":"用最美的文字寫最不該發生的事。讀得很慢，但值得讀完。","warning":"內容涉及對未成年人的性暴力，閱讀前請留意自己的狀態；未成年讀者建議有大人陪伴。","review":["這本書不好讀，我前後讀了六天。","讀的時候，我在筆記裡抄了兩段別人的話。一段是隨書小冊子收錄的讀者留言，大意是：讀書讓我們看見世界的黑暗面，卻不必親身經歷。另一段是評論家楊慶祥的推薦語：美好的東西因為脆弱而易碎，小說讓我們記住它，也帶來一點寬慰。這兩段話我一直記著。","小冊子也收了林奕含在訂婚宴上的致辭。她說，她想成為一個對他人的痛苦更有想像力的人。讀到書中說文學是最徒勞的那一段，我回了她一句：妳做到了。","（引用出處：簡體版《房思琪的初戀樂園》隨書小冊子，北京聯合出版公司／磨鐵圖書，2018。）"],"t":{"w":14.8,"h":21,"t":1.68,"pages":336,"img":1.572,"spine":true,"color":"#e0cfb7","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/fang-si-chi-front.webp","spineUrl":"/images/books/3d/fang-si-chi-spine.webp"}},{"id":"otoko-to-iu-mono","no":"B010","title":"男人這東西","author":"渡邊淳一","translator":"陸求實","publisher":"南門書局","year":2025,"isbn":"9786263423848","category":"文學","read":"2026-06","oneLine":"從男性的角度看戀愛、婚姻和倦怠，讀完覺得自己要學的還很多。","warning":"書中直白地談男性本能、外遇與婚姻，較適合成年讀者。","review":["渡邊淳一用很直白的方式寫男人的本能、戀愛和婚姻，很多段落與我觀察到的情況如出一轍，也有些地方我持保留態度。","我最在意的不是書裡的結論，而是讀完後給自己的功課：是否願意、並且有能力去對抗某些本能，是身為男性的我們需要思考和學習的。為了婚姻的品質和長久而學習、做出改變，感情是可以經營的。","幾句寫在旁邊的話：絕對的愛存在，但它很短暫；接受改變，不忘初心；換個角度想，倦怠也是安逸。讀到「自我的消融」時，我也想起了韓炳哲的《愛欲之死》。"],"t":{"w":14.8,"h":21,"t":1.5,"pages":241,"img":1.419,"spine":false,"color":"#0c5baa","ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/otoko-to-iu-mono-front.webp","spineUrl":""}},{"id":"transparency-society","no":"B005","title":"透明社會","author":"韓炳哲（Byung-Chul Han）","translator":"管中琪","publisher":"大塊文化","year":2019,"isbn":"9789865406363","category":"社會與媒介・哲學","read":"2026-07","oneLine":"越急著把一切攤開來看，我們越失去走近一個人的耐心。","review":["這本書讓我重新想「了解一個人」這件事。現代人很喜歡用 MBTI、依附風格來定義伴侶或朋友，但當你覺得「我完全懂你為什麼這樣」的時候，其實已經停止去感受他了。心理學給了我們了解他人的工具，也給了我們不再真正聆聽的藉口。","全透明的親密關係也是一樣。保留一點秘密，不是不忠誠，而是為了維持「你是你，我是我」的尊嚴。這也是為什麼在社群媒體「過度分享」的時代，我們反而更孤獨：每個人都急著展示一切，就失去了在現實中慢慢探索一個人的耐心與柔情。","另一個讓我記住的想法是：人腦演化不是為了裝下整個網路，而是為了過濾噪音。","這本書的內容很深刻，讀一次遠不足以參悟其中的道理，所以我留下這段紀錄，之後會再回來看。"],"t":{"w":14,"h":20,"t":1,"pages":100,"img":1.641,"spine":true,"color":"#bfdbb8","rtl":true,"vt":true,"ratio":1.4285714285714286,"fit":"100% 100%","frontUrl":"/images/books/3d/transparency-society-front.webp","spineUrl":"/images/books/3d/transparency-society-spine.webp"}},{"id":"gongzuo-de-fangfa","no":"B023","title":"稻盛和夫 工作的方法","author":"稻盛和夫","translator":"彭南儀","publisher":"天下雜誌","year":2024,"isbn":"9789863988014","category":"職場與決策","read":"2026-09","oneLine":"做出不亞於任何人的努力，是邁往成功的必要途徑。","review":["書裡談目標的地方，我寫下：從未來推估自己現在缺乏什麼能力去提升，是邁向未來、提升能力的重要步驟。寫完這句，又在下一則補上：英文⋯看來還是得好好面對呢。","不過讀到書裡說，把每一天當成生活的單位、日復一日拚命工作，就能走上人生的王道，我也老實寫下一點猶豫：走上王道的代價，不知道生活和健康還能留下多少呢。其他幾則筆記都很短，像是：不為私慾，全為理想；凡事務必感恩。"],"t":{"w":14.8,"h":21,"t":1.52,"pages":304,"img":1.419,"spine":true,"color":"#cecece","rtl":true,"vt":true,"ratio":1.4189189189189189,"fit":"100% 100%","frontUrl":"/images/books/3d/gongzuo-de-fangfa-front.webp","spineUrl":"/images/books/3d/gongzuo-de-fangfa-spine.webp"}},{"id":"yibai-ge-jiben","no":"B024","title":"松浦彌太郎的 100 個基本","author":"松浦彌太郎","translator":"黃薇嬪","publisher":"悅知文化","year":2023,"isbn":"9786267288702","category":"自我成長","read":"2026-09","oneLine":"書中描述的那些人，共通之處便是「勤奮」。","review":["若能做到書中描述的種種，大概都是很了不起的人吧。而他們的共通之處便是「勤奮」。願看過此書的人，都能以此勉勵自己，持續學習，重視他人，提升自己的同時不忘初心。努力讓自己從思考、行為舉止再到價值觀，都逐漸合乎「美」的標準。"],"t":{"w":11.2,"h":18.2,"t":2.16,"pages":432,"img":1.625,"spine":true,"color":"#d7d2cb","ratio":1.625,"fit":"100% 100%","frontUrl":"/images/books/3d/yibai-ge-jiben-front.webp","spineUrl":"/images/books/3d/yibai-ge-jiben-spine.webp"}},{"id":"animal-farm","no":"B033","title":"動物農莊","author":"喬治・歐威爾（George Orwell）","translator":"張家綺","publisher":"野人","year":2026,"isbn":"9786267880173","category":"文學","read":"2026-10","oneLine":"經典之作，反思人類在社會結構中的慣性與掙扎。","review":["讀到最後，豬和人坐在同一張桌上，說著同一套話，我在筆記裡寫：點睛之筆嗎？真諷刺呢。七誡一條一條被改掉，動物們卻越來越說不清原本是什麼樣子。這本書常被當成童書，但對孩子來說，內容還是太寫實了些。","喬治・歐威爾是民主社會主義者，西班牙內戰的經歷讓他看清了理想如何被權力掏空。他在 1943 到 1944 年間寫完這本書，當時英國和蘇聯是盟友，多家出版社因此不願出版，直到 1945 年才問世。一本批評權力的書，連出版都要先過權力這一關，這件事本身就很像書裡的情節。","世界局勢一直在變，我不覺得讀完一本書就能看懂這一切。但它讓我記住幾件小事：把原本說過的話留下來，有人改口時才對得起來；聽到口號時，先問是誰說的、誰得到好處。人的記憶和注意力是有限的，留下自己的思考，記住事件中透露出的相似與熟悉感，才能在相同的情況發生時辨認出來，而不是盲目聽從他人的語言或媒體的宣傳。"],"t":{"w":13,"h":19,"t":1.05,"pages":144,"img":1.462,"spine":true,"color":"#d1bfbd","rtl":true,"vt":true,"ratio":1.4615384615384615,"fit":"100% 100%","frontUrl":"/images/books/3d/animal-farm-front.webp","spineUrl":"/images/books/3d/animal-farm-spine.webp"}}]</script><footer class="site-foot"><span>© Jasper 林禹丞</span><span>vanyuc0316@gmail.com ・ <a href="https://www.instagram.com/vanyu.c/" style="color: inherit">IG @vanyu.c</a></span><span class="foot-row"><span>台南 · <time id="clock">臺灣時間</time></span><span data-views-total hidden></span><a href="#">回到頂部 ↑</a><a href="/behind/">網站幕後 →</a></span></footer><a class="to-top" href="#" id="to-top" aria-label="回到頂部" title="回到頂部" hidden><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 20V5M5 12l7-7 7 7"/></svg></a></div><script>
  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));

    // 深淺色切換：按鈕顯示目前是不是深色；手動選過就記住
    const tb = document.getElementById('theme-btn');
    const isDark = () => root.dataset.theme === 'dark';
    const show = () => tb.setAttribute('aria-pressed', String(isDark()));
    show();
    tb.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      show();
    });
    // 回到頂部：捲過一個畫面高之後才出現在右下角
    const top = document.getElementById('to-top');
    const showTop = () => { top.hidden = scrollY < innerHeight; };
    addEventListener('scroll', showTop, { passive: true });
    showTop();
    // 頁尾的臺灣時間，每分鐘更新
    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); };
    tick(); setInterval(tick, 30000);

    // 段落跟隨：捲到哪一段，段落列與側欄目錄就標出哪一段
    const links = [...document.querySelectorAll('.readbar nav a[href^="#"], .toc a[href^="#"]')];

    const { W } = S;
    if (!S.open) S.ry = wrap(S.ry);
    // 翻開時翻過去的那一面在左（右翻書在右）：寬螢幕整本移半頁讓兩頁置中；手機一次一頁，看對頁時整本移一頁
    const tx = !S.open ? 0 : (S.wide ? W / 2 : S.f ? W : 0) * (current.t.rtl ? -1 : 1);
    const rx = S.open ? 0 : S.rx, ry = S.open ? 0 : S.ry;
    holder.style.transform = tf(tx, 0, 1, rx, ry);
    light(rx, ry);
  }
  // 補間動畫：飛出、放回、翻開闔上都經過這裡。拖曳一開始就立刻結束動畫，不讓補間和手指搶位置
  let animT = 0;
  function animate(ms) { clearTimeout(animT); holder.classList.add('anim'); animT = setTimeout(endAnim, reduce ? 0 : ms); }
  function endAnim() { clearTimeout(animT); holder.classList.remove('anim'); }
  // 光影：光從左上前方打過來，依書本轉到的角度算出每個面朝向光的程度，背光的面蓋一層暗色
  const LIGHT = (() => { const v = [-0.38, -0.5, 0.78], n = Math.hypot(...v); return v.map((x) => x / n); })();
  const NORMALS = { front: [0, 0, 1], back: [0, 0, -1], spine: [-1, 0, 0], fore: [1, 0, 0], top: [0, -1, 0], bot: [0, 1, 0] };
  function light(rx, ry) {
    if (!S.faces) return;
    const a = ry * Math.PI / 180, c = rx * Math.PI / 180;
    const m = current?.t.rtl ? -1 : 1;
    for (const [k, [x0, y, z]] of Object.entries(NORMALS)) {
      const x = x0 * m;
      const x1 = x * Math.cos(a) + z * Math.sin(a), z1 = -x * Math.sin(a) + z * Math.cos(a);
      const y2 = y * Math.cos(c) - z1 * Math.sin(c), z2 = y * Math.sin(c) + z1 * Math.cos(c);
      const dot = x1 * LIGHT[0] + y2 * LIGHT[1] + z2 * LIGHT[2];
      const v = (0.5 * (1 - Math.max(0, dot))).toFixed(3);
      for (const el of S.faces[k]) { if (el.classList.contains('sh')) el.style.opacity = v; else el.style.setProperty('--sh', v); }
    }
  }
  function fit() {
    const sz = size(current.t); Object.assign(S, sz); if (S.wide) S.f = false; S.D = Math.max(6, current.t.t * S.W / current.t.w); build();
    stage.querySelector('.floor').style.setProperty('--fy', `${S.H / 2 + 30}px`);
  }

  let opener = null;
  function take(btn) {
    const b = BOOKS.find((x) => x.id === btn.dataset.id), t = TEX[b.id];
    current = { b, t, btn }; opener = btn;
    S = { rx: 8, ry: t.rtl ? 28 : -28, open: false, at: 0, f: false }; // 斜放時露出書口（書頁）那一側
    Object.assign(S, size(t));
    S.D = Math.max(6, t.t * S.W / t.w);
    capT.textContent = b.title; capS.textContent = `${b.author.split('（')[0]}・${b.read} 讀完`;
    stage.classList.add('on'); build();
    // 從書架上的位置飛出來：先放在書背的位置、轉成書背朝前，再補間到中間
    const r = btn.getBoundingClientRect(), hc = holder.getBoundingClientRect();
    const dx = r.left + r.width / 2 - hc.left, dy = r.top + r.height / 2 - hc.top, k = (r.height / S.H);
    endAnim();
    holder.style.transform = tf(dx, dy, k, 0, t.rtl ? -90 : 90);
    btn.classList.add('out');
    holder.getBoundingClientRect();
    animate(800);
    requestAnimationFrame(() => { stage.classList.add('show'); if (current) place(); });
    bOpen.focus({ preventScroll: true });
    S.since = performance.now(); syncZoom();
  }
  function putBack() {
    if (!current) return;
    cancelAnimationFrame(spin);
    // 書架可能在拿書期間重新排過（手機網址列縮放會觸發），所以每次都用書的編號重新找書架上的那本
    const id = current.b.id, live = () => caseEl.querySelector(`.bk[data-id="${id}"]`);
    S.open = false; S.at = 0; paint();
    const go = () => {
      const btn = live() || current.btn;
      const r = btn.getBoundingClientRect(), hc = holder.parentElement.getBoundingClientRect();
      const cx = hc.left + hc.width / 2, cy = hc.top + hc.height * 0.46;
      // 轉回書背朝前：取離目前角度最近的 90 度，不多轉一圈
      const sp = current.t.rtl ? -90 : 90, back = sp + 360 * Math.round((S.ry - sp) / 360);
      animate(800);
      holder.style.transform = tf(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy, r.height / S.H, 0, back);
      stage.classList.remove('show');
      setTimeout(() => { stage.classList.remove('on'); endAnim(); holder.innerHTML = ''; current = null; caseEl.querySelectorAll('.bk.out').forEach((x) => x.classList.remove('out')); live()?.focus({ preventScroll: true }); }, reduce ? 0 : 760);
    };
    setTimeout(go, reduce ? 0 : 380);
  }
  function setOpen(v) { cancelAnimationFrame(spin); S.since = performance.now(); S.open = v; S.f = false; if (!v) S.at = 0; animate(760); paint(); }
  // 往前或往後一頁。寬螢幕直接翻；手機先看完讀的這頁，再翻過去看對頁（S.f：正在看對頁）
  function go(d) {
    if (!S.open || S.wide) { S.f = false; flip(d); return; }
    if (d > 0) {
      if (S.f) { S.f = false; animate(600); paint(); }
      else if (S.at < S.leaves - 1) { S.f = true; animate(760); flip(1); }
    } else if (S.f) { S.f = false; animate(760); flip(-1); }
    else if (S.at > 0) { S.f = true; animate(600); paint(); }
    else flip(-1);
  }
  function flip(d) {
    if (!S.open) { if (d > 0) setOpen(true); return; }
    const n = Math.max(0, Math.min(S.leaves - 1, S.at + d));
    if (n === S.at) { if (d < 0 && S.at === 0) setOpen(false); return; }
    // 正在翻的那一張：往後翻是原本這頁，往前翻是要翻回來的那頁
    const el = S.leafEls[d > 0 ? S.at : n];
    el.classList.remove('turn-f', 'turn-b'); el.getBoundingClientRect();
    el.classList.add(d > 0 ? 'turn-f' : 'turn-b');
    setTimeout(() => el.classList.remove('turn-f', 'turn-b'), reduce ? 0 : 760);
    S.at = n; paint();
  }

  // 點到書與書之間、書擋或後牆時，拿離手指最近的那本（左右 24px 內），薄書比較好點
  caseEl.addEventListener('click', (e) => {
    if (current) return;
    let btn = e.target.closest('.bk');
    if (!btn) {
      let best = 25;
      for (const b of caseEl.querySelectorAll('.bk')) {
        const r = b.getBoundingClientRect();
        if (e.clientY < r.top - 20 || e.clientY > r.bottom + 20) continue;
        const d = Math.abs(e.clientX - (r.left + r.width / 2));
        if (d < best) { best = d; btn = b; }
      }
    }
    if (btn) take(btn);
  });
  // 手指一碰到書就先載書封，飛出來時已經有圖
  caseEl.addEventListener('pointerdown', (e) => { const id = e.target.closest('.bk')?.dataset.id; if (id && TEX[id].frontUrl) new Image().src = TEX[id].frontUrl; });
  // 字型晚到時，拿著的書用正確字型重排一次，免得分頁和實際字寬不符
  document.fonts?.ready.then(() => { if (current) fit(); });
  // 放大時：按鈕列跟著畫面走、維持原本大小，放回書架永遠按得到（不然放大後可能卡在畫面裡）
  const bar = stage.querySelector('.bar');
  function syncZoom() {
    const vv = window.visualViewport, zoomed = !!vv && vv.scale > 1.02;
    stage.classList.toggle('zoomed', zoomed);
    if (!zoomed) { bar.style.transform = ''; return; }
    bar.style.transformOrigin = '0 100%';
    bar.style.transform = `translate(${vv.offsetLeft}px, ${vv.offsetTop + vv.height - stage.clientHeight}px) scale(${1 / vv.scale})`;
  }
  window.visualViewport?.addEventListener('resize', syncZoom);
  window.visualViewport?.addEventListener('scroll', syncZoom);
  // 連點兩下不放大：翻頁鈕常被連按。瀏覽器會吞掉第二下的點擊，這裡補回去
  let lastTap = 0;
  stage.addEventListener('touchend', (e) => {
    if (e.touches.length || stage.classList.contains('zoomed')) return;
    if (e.timeStamp - lastTap < 350) { e.preventDefault(); e.target.closest('button:not(:disabled)')?.click(); }
    lastTap = e.timeStamp;
  }, { passive: false });
  bOpen.addEventListener('click', () => setOpen(!S.open));
  const dir = () => (current?.t.rtl ? -1 : 1); // 右翻書往左是下一頁
  bPrev.addEventListener('click', () => go(-dir()));
  bNext.addEventListener('click', () => go(dir()));
  bBack.addEventListener('click', putBack);
  addEventListener('keydown', (e) => {
    if (!current) return;
    if (e.key === 'Escape') { e.preventDefault(); putBack(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(dir()); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-dir()); }
    else if (e.key === 'Tab') { // 焦點留在對話框裡
      const f = [...stage.querySelectorAll('button:not(:disabled)')];
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f.at(-1).focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });

  // 拖曳：闔著的時候轉動書本；翻開的時候左右滑動翻頁
  // 拿著書的時候，滾輪不捲動後面的頁面
  stage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  // 拖曳放手後書會順著慣性再轉一下，慢慢停下
  let spin = 0;
  const coast = (v) => {
    cancelAnimationFrame(spin);
    if (reduce) return;
    const step = () => {
      if (!current || S.open || Math.abs(v) < 0.02) return;
      S.ry += v * 10; v *= 0.92; place(); spin = requestAnimationFrame(step);
    };
    spin = requestAnimationFrame(step);
  };
  let drag = null;
  let frame = 0;
  // 整個舞台都能拖曳、滑動，手指沒有剛好按在書上也能翻頁；下方按鈕列不算
  stage.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary) { drag = null; holder.classList.remove('drag'); return; } // 第二根手指放下來就是在縮放，交給瀏覽器
    if (!current || e.target.closest('.bar') || stage.classList.contains('zoomed')) return;
    cancelAnimationFrame(spin);
    if (!S.open) { endAnim(); place(); } // 書還在飛出來就直接到定位，從那裡開始轉
    drag = { out: !e.target.closest('.holder'), x: e.clientX, y: e.clientY, rx: S.rx, ry: S.ry, moved: false, t: e.timeStamp, lt: e.timeStamp, pts: [[e.timeStamp, e.clientX]], cx: e.clientX, cy: e.clientY };
    try { stage.setPointerCapture(e.pointerId); } catch {} holder.classList.add('drag');
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.cx = e.clientX; drag.cy = e.clientY; drag.lt = e.timeStamp;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > (e.pointerType === 'mouse' ? 4 : 10)) drag.moved = true; // 手指點一下常會小小滑動
    // 只留最近 100ms 的位置，放手時用來算速度
    drag.pts.push([e.timeStamp, e.clientX]);
    while (drag.pts.length > 2 && e.timeStamp - drag.pts[0][0] > 100) drag.pts.shift();
    // 一個畫格只轉一次：手機一次送來好幾個移動事件時不會重複計算光影
    if (!S.open && !frame) frame = requestAnimationFrame(() => {
      frame = 0;
      if (!drag || S.open) return;
      S.ry = drag.ry + (drag.cx - drag.x) * 0.5; S.rx = Math.max(-50, Math.min(50, drag.rx - (drag.cy - drag.y) * 0.35)); place();
    });
  });
  // 放手時的速度（每毫秒幾度的一半），用最近 100ms 的平均，並設上限：手機卡一下後一次補上的大位移不會把書甩到背面
  const speed = (d) => {
    const [t0, x0] = d.pts[0], [t1, x1] = d.pts.at(-1);
    if (t1 - t0 < 16) return 0;
    return Math.max(-1.2, Math.min(1.2, (x1 - x0) * 0.5 / (t1 - t0)));
  };
  const end = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    holder.classList.remove('drag');
    // 還沒畫出來的最後一個位置先補上，慣性從手指放開的地方接著轉
    if (frame) { cancelAnimationFrame(frame); frame = 0; if (!S.open) { S.ry = drag.ry + (drag.cx - drag.x) * 0.5; S.rx = Math.max(-50, Math.min(50, drag.rx - (drag.cy - drag.y) * 0.35)); place(); } }
    if (S.open && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go((dx < 0 ? 1 : -1) * dir());
    else if (!S.open && drag.moved && e.timeStamp - drag.lt < 80) coast(speed(drag)); // 放手前還在動才有慣性
    else if (!drag.moved) { // 單純點一下：闔著就翻開；翻開時點右半邊下一頁、左半邊上一頁（右翻書相反）
      // 點到書外：滑鼠一律放回書架。手指在翻開時算翻頁（閱讀中很容易點到）；闔著才放回，剛拿下來或剛闔上的 0.6 秒內不算，避免連點誤觸
      if (drag.out && e.pointerType === 'mouse') putBack();
      else if (drag.out && !S.open) { if (e.timeStamp - S.since > 600) putBack(); }
      else if (!S.open) setOpen(true);
      // 用螢幕正中間分左右：手機看對頁時整本書會移開一頁，用書的位置分會整個螢幕都算同一邊
      else go((e.clientX >= innerWidth / 2 ? 1 : -1) * dir());
    }
    drag = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', () => { drag = null; holder.classList.remove('drag'); });

})();
</script>
