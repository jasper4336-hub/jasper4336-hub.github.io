</style></head><body><div class="wrap"><header class="site-head"><a class="logo" href="/">Jasper</a><nav class="site-nav" aria-label="主選單"><a href="/works/">作品</a><a href="/posts/">文章</a><a href="/series/">合集</a><a href="/#about">關於</a><a class="nav-icon" href="/search/" aria-label="搜尋" title="搜尋"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"></circle><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4"></path></svg></a></nav></header><div class="readbar"><nav aria-label="本頁段落"></nav><div class="fs" role="group" aria-label="閱讀設定：字級與深淺色"><span>字級 <b id="fs-label">標準</b></span><button type="button" data-fs="-1" aria-label="字級縮小">A−</button><button type="button" data-fs="1" aria-label="字級放大">A+</button><button type="button" class="theme-btn" id="theme-btn" aria-label="切換深色模式" aria-pressed="false">深色</button><a class="cta-btn" href="/#contact">聯絡</a></div></div><h1 class="t1" style="margin-top: 40px" data-astro-cid-4ojkswfr>書架</h1><p class="lead" data-astro-cid-4ojkswfr>我讀過、想推薦的書。每本附上一句話推薦和短評，寫過完整心得的會連到文章。</p><div class="filters" id="filters" hidden data-astro-cid-4ojkswfr><div class="filter-row" role="group" aria-label="依分類篩選" data-astro-cid-4ojkswfr><span class="filter-k" data-astro-cid-4ojkswfr>分類</span><button type="button" data-cat="" aria-pressed="true" data-astro-cid-4ojkswfr>全部<small data-astro-cid-4ojkswfr>0</small></button></div></div><div class="shelf" id="shelf" data-astro-cid-4ojkswfr><p style="padding: 22px 0; color: var(--muted)" data-astro-cid-4ojkswfr>書架整理中。</p><p class="post-empty" id="shelf-empty" hidden data-astro-cid-4ojkswfr>這個分類目前沒有書。</p></div><footer class="site-foot"><span>© Jasper 林禹丞</span><span>vanyuc0316@gmail.com ・ <a href="https://www.instagram.com/vanyu.c/" style="color: inherit">IG @vanyu.c</a></span><span class="foot-row"><span>台南 · <time id="clock">臺灣時間</time></span><span data-views-total hidden></span><a href="#">回到頂部 ↑</a><a href="/behind/">網站幕後 →</a></span></footer></div><script>
  (function () {
    const scales = [0.9, 1, 1.15, 1.3];
    const names = ['小', '標準', '大', '特大'];
    const root = document.documentElement;
    const label = document.getElementById('fs-label');
    let i = scales.indexOf(parseFloat(getComputedStyle(root).getPropertyValue('--k')) || 1);
    if (i < 0) i = 1;
    const apply = () => {
      root.style.setProperty('--k', String(scales[i]));
      label.textContent = names[i];
      try { localStorage.setItem('fs-k', String(scales[i])); } catch (e) {}
    };
    label.textContent = names[i];
    document.querySelectorAll('[data-fs]').forEach((b) => b.addEventListener('click', () => {
      i = Math.min(scales.length - 1, Math.max(0, i + Number(b.dataset.fs)));
      apply();
    }));

    // 深淺色切換：按鈕顯示目前是不是深色；手動選過就記住
    const tb = document.getElementById('theme-btn');
    const isDark = () => root.dataset.theme === 'dark';
    const show = () => tb.setAttribute('aria-pressed', String(isDark()));
    show();
    tb.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      show();
    });
    // 頁尾的臺灣時間，每分鐘更新
    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); };
    tick(); setInterval(tick, 30000);

    // 段落跟隨：捲到哪一段，段落列與側欄目錄就標出哪一段
    const links = [...document.querySelectorAll('.readbar nav a[href^="#"], .toc a[href^="#"]')];
    const targets = [...new Set(links.map((a) => decodeURIComponent(a.hash.slice(1))))]
      .map((id) => document.getElementById(id)).filter(Boolean);
    if (targets.length) {
      const bar = document.querySelector('.readbar nav');
      let current = '';
      // 讀者開啟「減少動態效果」時，段落列直接跳到位置，不做平滑捲動
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mark = () => {
        // 最後一個已經捲過畫面上方 1/4 的段落，就是目前在讀的段落
        const line = window.innerHeight * 0.25;
        let id = '';
        for (const t of targets) if (t.getBoundingClientRect().top <= line) id = t.id;
        if (id === current) return;
        current = id;
        for (const a of links) {
          const on = decodeURIComponent(a.hash.slice(1)) === id;
          a.classList.toggle('on', on);
          if (on) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
          // 段落列是橫向捲動的，把目前段落捲進可見範圍（不動到整頁）
          if (on && bar && bar.contains(a)) bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 3, behavior: still ? 'auto' : 'smooth' });
        }
      };
      let ticking = false;
      addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; mark(); }); } }, { passive: true });
      addEventListener('resize', mark);
      mark();
    }
  })();
</script><script async data-goatcounter="https://jasper4336.goatcounter.com/count" src="https://gc.zgo.at/count.js"></script><script>(function(){const code = "jasper4336";

    // 文章與作品頁顯示這一頁的次數，頁尾顯示全站的總次數；讀不到就保持隱藏
    const show = (el, path, label) => el && fetch(`https://${code}.goatcounter.com/counter/${path}.json`)
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && d.count) { el.textContent = `${label} ${d.count} 次`; el.hidden = false; } })
      .catch(() => {});
    show(document.querySelector('[data-views]'), encodeURIComponent(location.pathname), '瀏覽');
    show(document.querySelector('[data-views-total]'), 'TOTAL', '全站瀏覽');
  })();</script></body></html><script>
  // 分類篩選：沒有 JavaScript 時篩選列不出現，全部書照常列出；選擇寫進網址（？cat=…）
  (function () {
    const box = document.getElementById('filters');
    const rows = [...document.querySelectorAll('.book')];
    if (!rows.length) return;
    const empty = document.getElementById('shelf-empty');
    const btns = [...box.querySelectorAll('[data-cat]')];
    let cat = new URLSearchParams(location.search).get('cat') || '';
    if (!btns.some((b) => b.dataset.cat === cat)) cat = '';
    const apply = (push) => {
      let shown = 0;
      for (const r of rows) { r.hidden = !!cat && r.dataset.cat !== cat; if (!r.hidden) shown++; }
      empty.hidden = shown > 0;
      for (const b of btns) b.setAttribute('aria-pressed', String(b.dataset.cat === cat));
      if (push) history.replaceState(null, '', location.pathname + (cat ? '?cat=' + encodeURIComponent(cat) : ''));
    };
    btns.forEach((b) => b.addEventListener('click', () => { cat = b.dataset.cat; apply(true); }));
    box.hidden = false;
    apply(false);
  })();
</script>
